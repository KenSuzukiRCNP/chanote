[package]
name = "chanote"
version = "0.4.0"
description = "茶道稽古記録アプリ / Tea ceremony practice log"
authors = ["Ken Suzuki"]
edition = "2021"
license = "MIT"

[lib]
name = "chanote_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
chanote-core = { path = "../crates/chanote-core" }
tauri = { version = "2.11", features = [] }
tauri-plugin-dialog = "2.7"
tauri-plugin-opener = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
