# chanote school pack: 裏千家 (Urasenke)
#
# Format
#   id / version           pack identity; bump version to have the app re-import
#   categories             grouping for the temae picker; `parent` nests categories
#   temae                  each entry: id, ja (required), romaji, en, category,
#                          defaults  = axis values prefilled when chosen (user can override)
#                          alias_of  = this is a familiar name for another temae; the record
#                                      stores the target as temae_id and this id as alias
#                          modifiers = axis values applied on top of the target's defaults
#   tana / hearth          plain lists; `parent` for grouping (e.g. daisu variants)
#
# Axis values (see docs/chanote-design.md §2.4)
#   tea     koicha | usucha | tsuzuki | "-" | "?"
#   tana    tana.<id> | "-" (運び) | "?"
#   hearth  ro | furo | binkake | nakaoki | tsurigama | dairo | sukigi | other | "?"
#   kinin   "-" | kinindate | kiyotsugu
#   tsukimono  list of: koicha sumi kinin-kiyotsugu tsubokazari musubi-fukusa jikukazari kou nagekomi
#
# Ids are stable identifiers, never shown to users. Do not rename; archive instead.

id: urasenke
version: "2026.09.3"
name: { ja: 裏千家, romaji: Urasenke, en: Urasenke school }

categories:
  - { id: hira,          ja: 平点前,   romaji: hiradate,        en: Basic procedures }
  - { id: konarai,       ja: 小習,     romaji: konarai,         en: Sixteen basic studies }
  - { id: konarai.mae8,  ja: 前八ヶ条, romaji: mae hakkajō,     en: First eight, parent: konarai }
  - { id: konarai.ato8,  ja: 後八ヶ条, romaji: ato hakkajō,     en: Latter eight, parent: konarai }
  - { id: sumi,          ja: 炭手前,   romaji: sumi-demae,      en: Charcoal procedures }
  - { id: ouyou,         ja: 応用・他, romaji: ōyō,             en: Applied / seasonal }
  - { id: chabako,       ja: 茶箱・盆略, romaji: chabako,       en: Tea box / tray procedures }
  - { id: shikaden,      ja: 四ヶ伝,   romaji: shikaden,        en: Four transmissions }
  - { id: okuden,        ja: 奥伝,     romaji: okuden,          en: Advanced transmissions }
  - { id: shichijishiki, ja: 七事式,   romaji: shichiji-shiki,  en: Seven group exercises }
  - { id: kagetsu,       ja: 花月之式, romaji: kagetsu no shiki, en: Kagetsu, parent: shichijishiki }

