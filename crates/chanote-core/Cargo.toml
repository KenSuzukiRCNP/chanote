[package]
name = "chanote-core"
version = "0.1.0"
edition = "2021"
description = "Database, schema and school-pack logic for chanote (no Tauri dependency)"
license = "MIT"

[dependencies]
rusqlite = { version = "0.40", features = ["bundled", "serde_json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
thiserror = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "tiff", "bmp"] }
base64 = "0.22"
zip = { version = "8", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
